plugins { id 'java' }

repositories {
    if (providers.gradleProperty('candidateRepository').isPresent()) {
        exclusiveContent {
            forRepository {
                maven {
                    url = uri(providers.gradleProperty('candidateRepository').get())
                }
            }
            filter { includeModule('io.github.lambig', 'functional-interface-extension') }
        }
    }
    mavenCentral()
}
dependencies {
    implementation "io.github.lambig:functional-interface-extension:${providers.gradleProperty('libraryVersion').getOrElse('1.1.3')}"
}
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}
tasks.register('runExample', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'example.OrderExample'
    if (providers.environmentVariable('TEST_JAVA_HOME').isPresent()) {
        executable = providers.environmentVariable('TEST_JAVA_HOME').get() + '/bin/java'
    }
    doFirst {
        def jars = configurations.runtimeClasspath.files
        if (jars.size() != 1 || !jars.first().name.startsWith('functional-interface-extension-')) {
            throw new GradleException("Unexpected runtime dependencies: ${jars*.name}")
        }
    }
}
